name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install RPM build dependencies
      run: |
        dnf update -y
        dnf install -y rpm-build rpmdevtools make tar gzip
        
    - name: Setup RPM build environment
      run: |
        rpmdev-setuptree
        
    - name: Build RPM package
      run: |
        chmod +x scripts/release.sh
        make rpm
        
    - name: List RPM artifacts
      run: |
        echo "Built RPM packages:"
        ls -la ~/rpmbuild/RPMS/noarch/
        
    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages
        path: ~/rpmbuild/RPMS/noarch/
        retention-days: 30

  build-deb:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install DEB build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts
        
    - name: Fix permissions
      run: |
        chmod +x debian/rules
        
    - name: Build DEB package
      run: |
        chmod +x scripts/release.sh debian/rules
        make deb
        
    - name: Move DEB packages to current directory
      run: |
        echo "Finding DEB packages..."
        if find .. -name "*.deb" -type f | head -1 | grep -q .; then
          find .. -name "*.deb" -type f -exec cp {} . \;
          echo "DEB packages copied to current directory:"
          ls -la *.deb
        else
          echo "No DEB packages found!"
          ls -la ../
          exit 1
        fi
        
    - name: Upload DEB artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deb-packages
        path: "*.deb"
        retention-days: 30

  release:
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download RPM artifacts
      uses: actions/download-artifact@v4
      with:
        name: rpm-packages
        path: ./rpm-packages
        
    - name: Download DEB artifacts
      uses: actions/download-artifact@v4
      with:
        name: deb-packages
        path: ./deb-packages
        
    - name: List downloaded files
      run: |
        echo "RPM packages:"
        find ./rpm-packages -type f
        echo "DEB packages:"
        find ./deb-packages -type f
        
    - name: Get tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: Release ${{ steps.tag.outputs.tag_name }}
        body: |
          ## hugepages-reserve-service ${{ steps.tag.outputs.tag_name }}
          
          ### Installation
          
          #### RPM (Red Hat/CentOS/Fedora/Rocky Linux/AlmaLinux)
          ```bash
          # Download and install
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag_name }}/hugepages-reserve-service-*.rpm
          sudo rpm -ivh hugepages-reserve-service-*.rpm
          ```
          
          #### DEB (Debian/Ubuntu)
          ```bash
          # Download and install
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag_name }}/hugepages-reserve-service_*.deb
          sudo dpkg -i hugepages-reserve-service_*.deb
          ```
          
          ### Usage
          1. Configure hugepage reservations in `/etc/hugepages.conf`
          2. Enable the service: `sudo systemctl enable hugepages-reserve.service`
          3. Start the service: `sudo systemctl start hugepages-reserve.service`
          
          See README.md for detailed configuration instructions.
        files: |
          rpm-packages/**
          deb-packages/**
        draft: false
        prerelease: false

  test-packages:
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os-image: 
          - rockylinux:9
          - ubuntu:22.04
          
    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: ${{ contains(matrix.os-image, 'rocky') && 'rpm-packages' || 'deb-packages' }}
        path: ./packages
        
    - name: Test RPM installation
      if: contains(matrix.os-image, 'rocky')
      run: |
        docker run --rm -v $(pwd)/packages:/packages ${{ matrix.os-image }} bash -c "
          dnf update -y
          rpm -ivh /packages/*.rpm
          systemctl list-unit-files | grep hugepages-reserve
          test -f /etc/hugepages.conf
          test -f /usr/lib/systemd/system/hugepages-reserve.service
          test -x /usr/lib/systemd/hugepages-reserve.sh
        "
        
    - name: Test DEB installation
      if: contains(matrix.os-image, 'ubuntu')
      run: |
        docker run --rm -v $(pwd)/packages:/packages ${{ matrix.os-image }} bash -c "
          apt-get update
          dpkg -i /packages/*.deb || apt-get install -f -y
          systemctl list-unit-files | grep hugepages-reserve
          test -f /etc/hugepages.conf
          test -f /lib/systemd/system/hugepages-reserve.service
          test -x /usr/lib/systemd/hugepages-reserve.sh
        "
