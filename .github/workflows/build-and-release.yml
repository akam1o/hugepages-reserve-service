name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install RPM build dependencies
      run: |
        dnf update -y
        dnf install -y rpm-build rpmdevtools make tar gzip
        
    - name: Setup RPM build environment
      run: |
        rpmdev-setuptree
        
    - name: Build RPM package
      run: |
        chmod +x scripts/release.sh
        make rpm
        
    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages
        path: ~/rpmbuild/RPMS/noarch/*.rpm
        retention-days: 30

  build-deb:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install DEB build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts
        
    - name: Fix permissions
      run: |
        chmod +x debian/rules
        
    - name: Build DEB package
      run: |
        chmod +x scripts/release.sh debian/rules
        make deb
        
    - name: Upload DEB artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deb-packages
        path: ../*.deb
        retention-days: 30

  release:
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download RPM artifacts
      uses: actions/download-artifact@v4
      with:
        name: rpm-packages
        path: ./rpm-packages
        
    - name: Download DEB artifacts
      uses: actions/download-artifact@v4
      with:
        name: deb-packages
        path: ./deb-packages
        
    - name: Get release info
      id: release_info
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
          echo "release_id=${{ github.event.release.id }}" >> $GITHUB_OUTPUT
        else
          # タグプッシュの場合は新しいリリースを作成
          tag_name=${GITHUB_REF#refs/tags/}
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
        fi
        
    - name: Create release (if tag push)
      if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: Release ${{ steps.release_info.outputs.tag_name }}
        body: |
          ## hugepages-reserve-service ${{ steps.release_info.outputs.tag_name }}
          
          ### Installation
          
          #### RPM (Red Hat/CentOS/Fedora/Rocky Linux/AlmaLinux)
          ```bash
          # Download and install
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/hugepages-reserve-service-*.noarch.rpm
          sudo rpm -ivh hugepages-reserve-service-*.noarch.rpm
          ```
          
          #### DEB (Debian/Ubuntu)
          ```bash
          # Download and install
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/hugepages-reserve-service_*_all.deb
          sudo dpkg -i hugepages-reserve-service_*_all.deb
          ```
          
          ### Usage
          1. Configure hugepage reservations in `/etc/hugepages.conf`
          2. Enable the service: `sudo systemctl enable hugepages-reserve.service`
          3. Start the service: `sudo systemctl start hugepages-reserve.service`
          
          See README.md for detailed configuration instructions.
        files: |
          ./rpm-packages/*.rpm
          ./deb-packages/*.deb
        draft: false
        prerelease: false

  test-packages:
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os-image: 
          - rockylinux:9
          - ubuntu:22.04
          
    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: ${{ contains(matrix.os-image, 'rocky') && 'rpm-packages' || 'deb-packages' }}
        path: ./packages
        
    - name: Test RPM installation
      if: contains(matrix.os-image, 'rocky')
      run: |
        docker run --rm -v $(pwd)/packages:/packages ${{ matrix.os-image }} bash -c "
          dnf update -y
          rpm -ivh /packages/*.rpm
          systemctl list-unit-files | grep hugepages-reserve
          test -f /etc/hugepages.conf
          test -f /usr/lib/systemd/system/hugepages-reserve.service
          test -x /usr/lib/systemd/hugepages-reserve.sh
        "
        
    - name: Test DEB installation
      if: contains(matrix.os-image, 'ubuntu')
      run: |
        docker run --rm -v $(pwd)/packages:/packages ${{ matrix.os-image }} bash -c "
          apt-get update
          dpkg -i /packages/*.deb || apt-get install -f -y
          systemctl list-unit-files | grep hugepages-reserve
          test -f /etc/hugepages.conf
          test -f /lib/systemd/system/hugepages-reserve.service
          test -x /usr/lib/systemd/hugepages-reserve.sh
        "
