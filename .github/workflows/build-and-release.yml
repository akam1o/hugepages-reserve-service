name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - container: "rockylinux:9"
            el_version: "el9"
          - container: "rockylinux:8"
            el_version: "el8"
          - container: "centos:7"
            el_version: "el7"
    
    container: ${{ matrix.container }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install RPM build dependencies
      run: |
        if [[ "${{ matrix.el_version }}" == "el7" ]]; then
          # EL7 uses yum
          yum update -y
          yum install -y rpm-build rpmdevtools make tar gzip
        else
          # EL8/EL9 use dnf
          dnf update -y
          dnf install -y rpm-build rpmdevtools make tar gzip
        fi
        
    - name: Setup RPM build environment
      run: |
        rpmdev-setuptree
        
    - name: Build RPM package
      env:
        GITHUB_REF: ${{ github.ref }}
      run: |
        chmod +x scripts/release.sh
        # Extract version from tag and update files
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Building for version: $TAG_VERSION"
          ./scripts/release.sh $TAG_VERSION
        fi
        # Update dist tag for different EL versions
        if [[ "${{ matrix.el_version }}" == "el7" ]]; then
          sed -i "s/%{?dist}/.el7/" rpm/hugepages-reserve-service.spec
        elif [[ "${{ matrix.el_version }}" == "el8" ]]; then
          sed -i "s/%{?dist}/.el8/" rpm/hugepages-reserve-service.spec
        else
          sed -i "s/%{?dist}/.el9/" rpm/hugepages-reserve-service.spec
        fi
        make rpm
        
    - name: List RPM artifacts
      run: |
        echo "Built RPM packages for ${{ matrix.el_version }}:"
        ls -la ~/rpmbuild/RPMS/noarch/
        
    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages-${{ matrix.el_version }}
        path: ~/rpmbuild/RPMS/noarch/
        retention-days: 30

  build-deb:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install DEB build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts
        
    - name: Fix permissions
      run: |
        chmod +x debian/rules
        
    - name: Build DEB package
      env:
        GITHUB_REF: ${{ github.ref }}
      run: |
        chmod +x scripts/release.sh debian/rules
        # Extract version from tag and update files
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Building for version: $TAG_VERSION"
          ./scripts/release.sh $TAG_VERSION
        fi
        make deb
        
    - name: Move DEB packages to current directory
      run: |
        echo "Finding DEB packages..."
        find .. -name "*.deb" -type f
        if find .. -name "*.deb" -type f | head -1 | grep -q .; then
          find .. -name "*.deb" -type f -exec mv {} . \;
          echo "DEB packages moved to current directory:"
          ls -la *.deb
        else
          echo "No DEB packages found!"
          ls -la ../
          exit 1
        fi
        
    - name: Upload DEB artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deb-packages
        path: "*.deb"
        retention-days: 30

  release:
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download RPM artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: rpm-packages-*
        path: ./rpm-packages
        merge-multiple: true
        
    - name: Download DEB artifacts
      uses: actions/download-artifact@v4
      with:
        name: deb-packages
        path: ./deb-packages
        
    - name: List downloaded files
      run: |
        echo "RPM packages:"
        find ./rpm-packages -type f
        echo "DEB packages:"
        find ./deb-packages -type f
        
    - name: Get tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag_name="${{ steps.tag.outputs.tag_name }}"
        
        # Create release notes
        cat > release_notes.md << 'EOF'
        ## hugepages-reserve-service ${{ steps.tag.outputs.tag_name }}
        
        ### Installation
        
        #### RPM (Red Hat/CentOS/Fedora/Rocky Linux/AlmaLinux)
        
        Choose the appropriate package for your system:
        
        ```bash
        # For EL9 (Rocky Linux 9, AlmaLinux 9, RHEL 9)
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag_name }}/hugepages-reserve-service-*-1.el9.noarch.rpm
        sudo rpm -ivh hugepages-reserve-service-*-1.el9.noarch.rpm
        
        # For EL8 (Rocky Linux 8, AlmaLinux 8, RHEL 8, CentOS 8)
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag_name }}/hugepages-reserve-service-*-1.el8.noarch.rpm
        sudo rpm -ivh hugepages-reserve-service-*-1.el8.noarch.rpm
        
        # For EL7 (CentOS 7, RHEL 7)
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag_name }}/hugepages-reserve-service-*-1.el7.noarch.rpm
        sudo rpm -ivh hugepages-reserve-service-*-1.el7.noarch.rpm
        ```
        
        #### DEB (Debian/Ubuntu)
        ```bash
        # Download and install
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag_name }}/hugepages-reserve-service_*.deb
        sudo dpkg -i hugepages-reserve-service_*.deb
        ```
        
        ### Usage
        1. Configure hugepage reservations in `/etc/hugepages.conf`
        2. Enable the service: `sudo systemctl enable hugepages-reserve.service`
        3. Start the service: `sudo systemctl start hugepages-reserve.service`
        
        See README.md for detailed configuration instructions.
        EOF
        
        # Check if release already exists
        if gh release view "$tag_name" >/dev/null 2>&1; then
          echo "Release $tag_name already exists, updating it..."
          gh release edit "$tag_name" --notes-file release_notes.md
        else
          echo "Creating new release $tag_name..."
          gh release create "$tag_name" --title "Release $tag_name" --notes-file release_notes.md
        fi
        
        # Upload files
        echo "Uploading files..."
        find ./rpm-packages -name "*.rpm" -exec gh release upload "$tag_name" {} \;
        find ./deb-packages -name "*.deb" -exec gh release upload "$tag_name" {} \;

  test-packages:
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os-image: "rockylinux:9"
            package-type: "rpm-packages-el9"
            install-cmd: "dnf install -y systemd && rpm -ivh"
            systemd-path: "/usr/lib/systemd/system"
          - os-image: "rockylinux:8"
            package-type: "rpm-packages-el8"
            install-cmd: "dnf install -y systemd && rpm -ivh"
            systemd-path: "/usr/lib/systemd/system"
          - os-image: "almalinux:7"
            package-type: "rpm-packages-el7"
            install-cmd: "yum install -y systemd && rpm -ivh"
            systemd-path: "/usr/lib/systemd/system"
          - os-image: "ubuntu:22.04"
            package-type: "deb-packages"
            install-cmd: "apt-get update && dpkg -i"
            systemd-path: "/lib/systemd/system"
          
    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.package-type }}
        path: ./packages
        
    - name: Test package installation
      run: |
        docker run --rm -v $(pwd)/packages:/packages ${{ matrix.os-image }} bash -c "
          echo 'Installing package dependencies...'
          if [[ '${{ matrix.package-type }}' == *'rpm'* ]]; then
            if [[ '${{ matrix.os-image }}' == *'7' ]]; then
              yum update -y
              yum install -y systemd
            else
              dnf update -y
              dnf install -y systemd
            fi
            echo 'Installing RPM package...'
            rpm -ivh /packages/*.rpm --nodeps || rpm -ivh /packages/*.rpm
          else
            apt-get update
            echo 'Installing DEB package...'
            dpkg -i /packages/*.deb || apt-get install -f -y
          fi
          
          echo 'Verifying installation...'
          test -f /etc/hugepages.conf && echo '✓ Configuration file installed'
          test -f ${{ matrix.systemd-path }}/hugepages-reserve.service && echo '✓ Service file installed'
          test -x /usr/lib/systemd/hugepages-reserve.sh && echo '✓ Script installed with execute permission'
          
          echo 'Checking service file content...'
          cat ${{ matrix.systemd-path }}/hugepages-reserve.service
          
          echo 'Checking if systemctl can find the service...'
          if command -v systemctl >/dev/null 2>&1; then
            systemctl list-unit-files | grep hugepages-reserve || echo 'Service not yet enabled (normal for fresh install)'
          else
            echo 'systemctl not available in container'
          fi
          
          echo '${{ matrix.package-type }} package installation test completed successfully!'
        "
