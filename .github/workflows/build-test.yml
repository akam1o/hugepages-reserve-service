name: Build Test

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "RPM Build Test"
            container: "rockylinux:9"
            build_cmd: "make rpm"
            deps_cmd: "dnf update -y && dnf install -y rpm-build rpmdevtools make tar gzip && rpmdev-setuptree"
          - name: "DEB Build Test"
            container: ""
            build_cmd: "chmod +x debian/rules && make deb"
            deps_cmd: "sudo apt-get update && sudo apt-get install -y build-essential debhelper devscripts"
    
    name: ${{ matrix.name }}
    container: ${{ matrix.container }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install build dependencies
      run: ${{ matrix.deps_cmd }}
        
    - name: Build package
      run: |
        chmod +x scripts/release.sh
        if [[ "${{ matrix.container }}" != "" ]]; then
          chmod +x debian/rules 2>/dev/null || true
        fi
        ${{ matrix.build_cmd }}
      
    - name: Verify build artifacts
      run: |
        if [[ "${{ matrix.name }}" == *"RPM"* ]]; then
          ls -la ~/rpmbuild/RPMS/noarch/
          test -f ~/rpmbuild/RPMS/noarch/hugepages-reserve-service-*.rpm
        else
          ls -la ../
          test -f ../hugepages-reserve-service_*.deb
        fi
